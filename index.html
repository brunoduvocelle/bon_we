<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bon Week-end - Double Explosion</title>
    <style>
        :root {
            --bg-start: #1a001a;
            --bg-end: #000000;
            --pink: #FF69B4;
            --yellow: #FFD700;
            --white: #FFFFFF;
        }

        body {
            background: radial-gradient(circle at bottom, var(--bg-start) 0%, var(--bg-end) 100%);
            margin: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Times New Roman', serif;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 10;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .arc-wrapper {
            position: relative;
            width: 100%;
            height: 50vh;
            margin-top: 5vh;
            display: flex;
            justify-content: center;
        }

        .char {
            position: absolute;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1;
            animation: liquidGlow 3s infinite alternate;
            transition: all 0.5s ease-out;
            will-change: transform, color;
        }

        @keyframes liquidGlow {
            0% { color: var(--yellow); text-shadow: 0 0 10px var(--yellow); }
            100% { color: var(--pink); text-shadow: 0 0 20px var(--pink), 0 0 30px var(--yellow); }
        }

        .hearts {
            display: flex;
            gap: 5vw;
            margin-bottom: 10vh;
            pointer-events: auto;
        }

        .heart {
            font-size: 20vmin;
            animation: superBeat 1.3s infinite cubic-bezier(0.2, 0.6, 0.35, 1);
            cursor: pointer;
        }

        @keyframes superBeat {
            0% { transform: scale(1); color: var(--pink); filter: drop-shadow(0 0 5px var(--pink)); }
            15% { transform: scale(1.3); color: var(--yellow); filter: drop-shadow(0 0 25px var(--yellow)); }
            45% { transform: scale(1.5); color: var(--white); filter: drop-shadow(0 0 50px var(--pink)); }
            100% { transform: scale(1); color: var(--pink); filter: drop-shadow(0 0 5px var(--pink)); }
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>
    
    <div class="container">
        <div class="arc-wrapper" id="text-arc"></div>
        
        <div class="hearts">
            <div class="heart" id="heart1">❤</div>
            <div class="heart" id="heart2" style="animation-delay: 0.15s;">❤</div>
        </div>
    </div>

    <script>
    {
        const TEXT_CONTENT = "BON WEEK-END";
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const arcWrapper = document.getElementById('text-arc');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        let particles = [];
        const COLORS = ['#FFD700', '#FF69B4']; // Uniquement Jaune et Rose

        TEXT_CONTENT.split('').forEach(char => {
            const span = document.createElement('span');
            span.className = 'char';
            span.textContent = char;
            arcWrapper.appendChild(span);
        });

        const layoutText = () => {
            const chars = document.querySelectorAll('.char');
            const w = window.innerWidth;
            const h = window.innerHeight;
            const isMobile = w < 800;
            const count = chars.length;
            let radius, fontSize, angleStep, startAngle, yOffset;

            if (isMobile) {
                radius = w * 0.45; fontSize = `${w * 0.10}px`; angleStep = 10; yOffset = h * 0.45;
            } else {
                radius = h * 0.8; fontSize = `${h * 0.12}px`; angleStep = 5; yOffset = h * 0.65;
            }

            startAngle = -(angleStep * (count - 1)) / 2;
            chars.forEach((char, i) => {
                const angle = startAngle + (i * angleStep);
                char.style.fontSize = fontSize;
                char.style.height = `${radius}px`;
                char.style.transformOrigin = 'bottom center';
                char.style.transform = `translateY(${yOffset - radius}px) rotate(${angle}deg)`;
            });
        };

        class Particle {
            constructor(x, y, color, velocity, canSplit = false) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.velocity = velocity;
                this.alpha = 1;
                this.friction = 0.96;
                this.gravity = 0.15;
                this.canSplit = canSplit;
                this.life = 0;
                this.splitTime = Math.floor(Math.random() * 20) + 15; // Temps avant le 2ème étage
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.canSplit ? 4 : 2, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.velocity.x *= this.friction;
                this.velocity.y *= this.friction;
                this.velocity.y += this.gravity;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= this.canSplit ? 0.01 : 0.02;
                this.life++;

                // Logique du 2ème étage (éclatement)
                if (this.canSplit && this.life === this.splitTime) {
                    this.split();
                }
            }

            split() {
                for (let i = 0; i < 20; i++) {
                    const v = {
                        x: (Math.random() - 0.5) * 8,
                        y: (Math.random() - 0.5) * 8
                    };
                    particles.push(new Particle(this.x, this.y, this.color, v, false));
                }
                this.alpha = 0; // La particule mère disparaît
            }
        }

        const createFirework = (x, y) => {
            // Premier étage : lancement de particules mères
            for (let i = 0; i < 40; i++) {
                const color = COLORS[Math.floor(Math.random() * COLORS.length)];
                const v = {
                    x: (Math.random() - 0.5) * 18,
                    y: (Math.random() - 0.5) * 18
                };
                particles.push(new Particle(x, y, color, v, true));
            }
        };

        const animate = () => {
            requestAnimationFrame(animate);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    particles[i].draw();
                }
            }
        };

        window.addEventListener('touchstart', (e) => {
            e.preventDefault();
            Array.from(e.touches).forEach(t => createFirework(t.clientX, t.clientY));
        }, { passive: false });

        window.addEventListener('mousedown', (e) => createFirework(e.clientX, e.clientY));
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            layoutText();
        });

        layoutText();
        animate();
    }
    </script>
</body>
</html>
